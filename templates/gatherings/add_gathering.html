{% extends "base.html" %}
{% block title %}Add Gathering{% endblock %}
{% block content %}

<div class="form-container">
    <h2>Schedule New Gathering</h2>
    <form method="POST">
        <div class="form-group">
            <label>Gathering Name</label>
            <input type="text" name="gathering_name" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Category</label>
            <input type="text" name="category" class="form-control" placeholder="e.g. Technology, Music, Sports">
        </div>
        <div class="form-group">
            <label>Start Date & Time</label>
            <input type="datetime-local" name="start_datetime" class="form-control" required>
        </div>
        <div class="form-group">
            <label>End Date & Time</label>
            <input type="datetime-local" name="end_datetime" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Venue</label>
            <select name="venue_id" class="form-control" required>
                <option value="">-- Select Venue --</option>
                {% for v in venues %}
                <option value="{{ v[0] }}">{{ v[1] }} ({{ v[2] }})</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Save Gathering</button>
        <a href="{{ url_for('gatherings.list_gatherings') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>

{% endblock %}
