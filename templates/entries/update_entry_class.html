{% extends "base.html" %}
{% block title %}Update Entry Class{% endblock %}
{% block content %}

<div class="page-header">
    <h2>Update Entry Class</h2>
    <a href="{{ url_for('entry_bp.add_entry_class') }}" class="btn btn-secondary btn-sm">← Back to Entry Classes</a>
</div>

<div class="form-container">
    <form method="POST">
        <div class="form-group">
            <label>Select Entry Class Combination to Update</label>
            <select name="gec_id" class="form-control" required>
                <option value="" disabled selected>-- Select an Entry Class --</option>
                {% for record in gec_records %}
                    <option value="{{ record[0] }}">{{ record[1] }} - {{ record[2] }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>New Price</label>
            <input type="number" step="0.01" name="price" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Allocated Seats</label>
            <input type="number" name="allocated_seats" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary">Update</button>
        <a href="{{ url_for('entry_bp.add_entry_class') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>

{% endblock %}
