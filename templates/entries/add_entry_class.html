<!DOCTYPE html>
<html>
<head>
    <title>Add Entry Class</title>
</head>
<body>
    <h1>Add Gathering Entry Class</h1>
    <form method="POST">
        <label>Gathering:</label>
        <select name="gathering_id">
            {% for gathering in gatherings %}
                <option value="{{ gathering[0] }}">{{ gathering[1] }}</option>
            {% endfor %}
        </select>
        <br><br>
        <label>Entry Class:</label>
        <select name="entry_class_id">
            {% for entry_class in entry_classes %}
                <option value="{{ entry_class[0] }}">{{ entry_class[1] }}</option>
            {% endfor %}
        </select>
        <br><br>
        <label>Price:</label>
        <input type="number" step="0.01" name="price" required>
        <br><br>
        <label>Allocated Seats:</label>
        <input type="number" name="allocated_seats" required>
        <br><br>
        <button type="submit">Add Entry Class</button>
    </form>
</body>
</html>
