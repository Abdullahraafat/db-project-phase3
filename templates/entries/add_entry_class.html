{% extends "base.html" %}
{% block title %}Add Entry Class{% endblock %}
{% block content %}

<div class="page-header">
    <h2>Entry Class Management</h2>
    <div>
        <a href="{{ url_for('entry_bp.inquiry1') }}" class="btn btn-info btn-sm">Inquiry 1: Popular Categories</a>
        <a href="{{ url_for('entry_bp.inquiry5') }}" class="btn btn-info btn-sm">Inquiry 5: Classes per Gathering</a>
        <a href="{{ url_for('entry_bp.update_entry_class') }}" class="btn btn-warning btn-sm">Update Entry Class</a>
    </div>
</div>

<div class="form-container">
    <h3>Add Gathering Entry Class</h3>
    <form method="POST">
        <div class="form-group">
            <label>Gathering</label>
            <select name="gathering_id" class="form-control" required>
                <option value="">-- Select Gathering --</option>
                {% for gathering in gatherings %}
                    <option value="{{ gathering[0] }}">{{ gathering[1] }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Entry Class</label>
            <select name="entry_class_id" class="form-control" required>
                <option value="">-- Select Entry Class --</option>
                {% for entry_class in entry_classes %}
                    <option value="{{ entry_class[0] }}">{{ entry_class[1] }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Price</label>
            <input type="number" step="0.01" name="price" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Allocated Seats</label>
            <input type="number" name="allocated_seats" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Add Entry Class</button>
        <a href="{{ url_for('entry_bp.add_entry_class') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>

{% endblock %}
