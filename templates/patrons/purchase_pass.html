{% extends "base.html" %}
{% block title %}Purchase Entry Pass{% endblock %}
{% block content %}

<div class="page-header">
    <h2>Purchase Entry Pass</h2>
    <div>
        <a href="{{ url_for('patrons.register_patron') }}" class="btn btn-secondary btn-sm">← Back to Patrons</a>
    </div>
</div>

<div class="form-container">
    <form method="POST">
        <div class="form-group">
            <label>Patron ID</label>
            <input type="number" name="patron_id" class="form-control" placeholder="Patron ID" required>
        </div>

        <div class="form-group">
            <label>Gathering Entry Class ID</label>
            <input type="number" name="gathering_entry_class_id" class="form-control" placeholder="Gathering Entry Class ID" required>
        </div>

        <div class="form-group">
            <label>Seat Number (Optional)</label>
            <input type="text" name="seat_number" class="form-control" placeholder="Seat Number">
        </div>

        <div class="form-group">
            <label>Price Paid</label>
            <input type="number" step="0.01" name="price_paid" class="form-control" placeholder="Price Paid" required>
        </div>

        <button type="submit" class="btn btn-primary">Purchase Pass</button>
        <a href="{{ url_for('patrons.register_patron') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>

{% endblock %}
