<!DOCTYPE html>
<html>
<head>
    <title>Purchase Pass</title>
</head>
<body>

<h2>Purchase Entry Pass</h2>

<form method="POST">

    <input type="number"
           name="patron_id"
           placeholder="Patron ID"
           required>

    <br><br>

    <input type="number"
           name="gathering_entry_class_id"
           placeholder="Gathering Entry Class ID"
           required>

    <br><br>

    <input type="text"
           name="seat_number"
           placeholder="Seat Number">

    <br><br>

    <input type="number"
           step="0.01"
           name="price_paid"
           placeholder="Price Paid"
           required>

    <br><br>

    <button type="submit">
        Purchase
    </button>

</form>

</body>
</html>
