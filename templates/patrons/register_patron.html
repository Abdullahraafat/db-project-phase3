{% extends "base.html" %}
{% block title %}Register Patron{% endblock %}
{% block content %}

<div class="page-header">
    <h2>Patron Management</h2>
    <div>
        <a href="{{ url_for('patrons.inquiry4') }}" class="btn btn-info btn-sm">Inquiry 4: No Passes</a>
        <a href="{{ url_for('patrons.inquiry6') }}" class="btn btn-info btn-sm">Inquiry 6: Spending</a>
        <a href="{{ url_for('patrons.purchase_pass') }}" class="btn btn-success btn-sm">Purchase Pass</a>
    </div>
</div>

<div class="form-container">
    <h3>Register New Patron</h3>

    <form method="POST">
        <div class="form-group">
            <label>First Name</label>
            <input type="text" name="first_name" class="form-control" placeholder="First Name" required>
        </div>

        <div class="form-group">
            <label>Last Name</label>
            <input type="text" name="last_name" class="form-control" placeholder="Last Name" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" class="form-control" placeholder="Email" required>
        </div>

        <div class="form-group">
            <label>Phone (Optional)</label>
            <input type="text" name="phone" class="form-control" placeholder="Phone">
        </div>

        <button type="submit" class="btn btn-primary">Register Patron</button>
        <a href="/" class="btn btn-secondary">Cancel</a>
    </form>
</div>

{% endblock %}
